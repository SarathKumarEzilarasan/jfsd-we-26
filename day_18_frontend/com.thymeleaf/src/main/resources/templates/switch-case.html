<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
  <h3 th:text="${user.name}"></h3>
  <div th:switch=${user.role}>
    <p th:case="'ADMIN'">User is a Admin User</p>
    <p th:case="'USER'">User is a normal User</p>
    <p th:case="*">Invalid User</p>
  </div>
</body>
</html>
