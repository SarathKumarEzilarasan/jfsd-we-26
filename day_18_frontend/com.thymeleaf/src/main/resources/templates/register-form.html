<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div>
    <div style="border-style:solid; width:500px">
        <h1>User Registration</h1>
        <form method="post" th:action="@{/register/save}" th:object="${user}">
            <label>Name: </label>
            <input type="text" th:field="*{name}">
            <br>
            <label>Email: </label>
            <input type="email" th:field="*{email}">
            <br>
            <label>Role: </label>
            <select th:field="*{role}">
                <option th:each="profession :${professions}" th:value="${profession}" th:text="${profession}"></option>
            </select>
            <br>
            <label>Gender: </label>
            <input type="radio" th:field="*{gender}" value="Male"> Male
            <input type="radio" th:field="*{gender}" value="Female"> Female
            <br>

            <button type="submit">Register</button>
        </form>
    </div>
</div>
</body>
</html>
